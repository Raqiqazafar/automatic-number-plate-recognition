<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatic Number Plate Detection</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }
      h1 {
        font-weight: 700;
        color: #1e3a8a;
      }
      .card {
        border-radius: 1rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        padding: 2rem;
        margin-bottom: 2rem;
        background: #ffffff;
      }
      .btn-primary {
        background: linear-gradient(90deg, #4f8ef7, #2b6df7);
        border: none;
        padding: 0.6rem 1.5rem;
        font-weight: 500;
        transition: 0.3s;
      }
      .btn-primary:hover {
        background: linear-gradient(90deg, #2b6df7, #4f8ef7);
      }
      .img-fluid {
        border-radius: 1rem;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s ease;
      }
      .img-fluid.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .drag-drop {
        border: 2px dashed #4f8ef7;
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        margin-bottom: 0.5rem;
      }
      .drag-drop.dragover {
        background: #e3f2fd;
      }
      .spinner {
        display: none;
        margin: 1rem auto;
      }
      .detected-text {
        font-weight: 600;
        color: #2d7a2d;
        animation: fadeIn 1s ease forwards;
      }
      #file-name {
        font-weight: 500;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-5">Automatic Number Plate Detection</h1>

      <!-- Upload Card -->
      <div class="card mx-auto" style="max-width: 500px">
        <form method="POST" enctype="multipart/form-data" id="upload-form">
          <div class="drag-drop" id="drop-area">
            Drag & Drop or Click to Upload Image
            <input
              type="file"
              name="file"
              id="file-input"
              style="display: none"
              required
            />
          </div>
          <div id="file-name" class="text-center mb-2 text-primary"></div>
          <button type="submit" class="btn btn-primary w-100">
            Upload & Detect
          </button>
        </form>
        <div
          class="spinner-border text-primary spinner"
          role="status"
          id="loading-spinner"
        >
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Detection Results -->
      {% if detected_text %}
      <div class="card mx-auto p-4" style="max-width: 900px">
        <div class="text-center mb-4">
          <h4>
            Detected Number Plate Text:
            <span class="detected-text">{{ detected_text }}</span>
          </h4>
        </div>
        <div class="row text-center">
          <div class="col-md-6 mb-3">
            <h5>Original Image</h5>
            <img src="{{ original }}" class="img-fluid visible" />
          </div>
          <div class="col-md-6 mb-3">
            <h5>Detection Result</h5>
            <img src="{{ result }}" class="img-fluid visible" />
          </div>
        </div>
      </div>
      {% endif %}
    </div>

    <script>
      const dropArea = document.getElementById("drop-area");
      const fileInput = document.getElementById("file-input");
      const form = document.getElementById("upload-form");
      const spinner = document.getElementById("loading-spinner");
      const fileNameDisplay = document.getElementById("file-name");

      // Click to open file selector
      dropArea.addEventListener("click", () => fileInput.click());

      // Dragover effect
      dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.classList.add("dragover");
      });
      dropArea.addEventListener("dragleave", () =>
        dropArea.classList.remove("dragover")
      );

      // Drop file
      dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length) {
          fileInput.files = files;
          fileNameDisplay.textContent = `Selected: ${files[0].name}`;
        }
      });

      // Show selected filename when file chosen via click
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          fileNameDisplay.textContent = `Selected: ${fileInput.files[0].name}`;
        }
      });

      // Show spinner on submit
      form.addEventListener("submit", () => {
        if (fileInput.files.length) {
          spinner.style.display = "block";
          fileNameDisplay.textContent = `Uploading: ${fileInput.files[0].name} ...`;
        }
      });
    </script>
  </body>
</html>
